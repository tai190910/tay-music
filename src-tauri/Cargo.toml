[package]
name = "tay-music"
version = "1.5.0"
description = "Tày Music PC Desktop Application"
authors = ["Tày Music Team"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.87"

[lib]
name = "tay_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "gzip", "deflate"] }
axum = "0.8"
bytes = "1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
url = "2"
urlencoding = "2"
base64 = "0.22"
sha1 = "0.10"
unicode-normalization = "0.1"
rquickjs = "0.14"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
